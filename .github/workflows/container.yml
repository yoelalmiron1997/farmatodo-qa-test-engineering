# Imagen del ambiente congelado. En master y en PR solo se construye y se prueba; con un tag vX.Y.Z además se
# publica en GitHub Packages (ghcr.io) como <versión> y latest. La versión de Chrome sale de la corrida
# validada (environment del último resultado) o del valor por defecto del Dockerfile.
name: container

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths-ignore: ["docs/**", "**.md", "specs/**"]
  pull_request:
    branches: [master]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/container.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Construir, probar y publicar la imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versión
        id: meta
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Construir
        run: |
          docker build --pull --build-arg VERSION="${{ steps.meta.outputs.version }}" \
            -t "$IMAGE:test" .
      - name: Probar la imagen
        run: |
          docker run --rm "$IMAGE:test" word-frequency data/samples/farmatodo_example.txt | tee output.txt
          diff -u data/samples/farmatodo_example.expected.txt output.txt
          docker run --rm "$IMAGE:test" pytest -q
          docker run --rm "$IMAGE:test" pytest -q tests/e2e -k "basic_word_count or top_three" -p no:randomly
      - name: Publicar en GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${GITHUB_REF_NAME#v}" = "${{ steps.meta.outputs.version }}" ] || { echo "::error::tag ≠ versión"; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${{ steps.meta.outputs.version }}" latest; do
            docker tag "$IMAGE:test" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.meta.outputs.version }}" | tee -a "$GITHUB_STEP_SUMMARY"
