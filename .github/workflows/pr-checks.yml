# Workflow A — Chequeos rápidos sin dependencias de sitios externos.
# Versiones de acciones fijadas por SHA de commit (comentario = etiqueta), verificadas el 2026-10-23
# con `git ls-remote`; Dependabot las mantiene actualizadas.
name: pr-checks

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions: {}

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · tipos · arquitectura · unit · integración · specs · docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Instalar dependencias (lockfile)
        run: uv sync --frozen --group dev --group docs
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formato (ruff format)
        run: uv run ruff format --check .
      - name: Tipos (mypy --strict)
        run: uv run mypy
      - name: Contratos de arquitectura (import-linter)
        run: uv run lint-imports
      - name: Especificaciones y trazabilidad
        run: uv run qa specs validate
      - name: Tests unitarios (sin red) e integración, con cobertura del framework
        run: |
          uv run coverage run -m pytest tests/unit tests/integration --junitxml=reports/junit-unit.xml
          uv run coverage report
          uv run coverage xml -o reports/coverage.xml
      - name: Construir el portal (detecta enlaces rotos)
        run: |
          uv run qa portal build
          uv run mkdocs build --strict --site-dir site
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-checks-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  readme-smoke:
    # TC-DEL-001: los comandos del README en un runner limpio, sin caché.
    name: README reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uv sync --group dev
      - name: Ejercicio 4 con el ejemplo del PDF
        run: |
          uv run word-frequency data/samples/farmatodo_example.txt | tee output.txt
          diff -u data/samples/farmatodo_example.expected.txt output.txt
      - run: uv run pytest tests/unit
