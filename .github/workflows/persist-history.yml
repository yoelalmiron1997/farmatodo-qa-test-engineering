# Reutilizable: agrega el run-result.json de una corrida a la rama `qa-history`.
# Archivo inmutable por (workflow, run_id, run_attempt); escritura serializada y reintento ante carreras.
name: persist-history

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string

permissions: {}

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: qa-history-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: reports
      - name: ¿Hay resultado normalizado?
        id: check
        run: |
          if [ -f reports/run-result.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::warning::sin run-result.json"; echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.check.outputs.found == 'true'
        with:
          enable-cache: true
      - name: Preparar la rama qa-history
        if: steps.check.outputs.found == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin qa-history; then
            git worktree add history FETCH_HEAD
            git -C history switch -c qa-history
          else
            git worktree add --orphan -b qa-history history
            printf '# qa-history\n\nResultados normalizados de GitHub Actions (schema run-result v1). No editar a mano.\n' > history/README.md
          fi
      - name: Guardar la corrida (nunca sobrescribe)
        if: steps.check.outputs.found == 'true'
        run: |
          uv sync --frozen --no-dev
          uv run qa history save --run reports/run-result.json --history-dir history
      - name: Commit y push con reintentos
        if: steps.check.outputs.found == 'true'
        working-directory: history
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nada nuevo que registrar"; exit 0; fi
          git commit -m "history: ${{ inputs.artifact-name }} run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:qa-history; then exit 0; fi
            echo "push rechazado (intento $i); rebase sobre el remoto"
            git fetch origin qa-history && git rebase FETCH_HEAD
            sleep $((i * 3))
          done
          echo "::error::no se pudo registrar el historial tras 5 intentos"; exit 1
